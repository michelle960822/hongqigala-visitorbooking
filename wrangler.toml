name = "auto-expo-booking"
main = "src/index.js"
compatibility_date = "2025-01-01"

# 前端静态资源（public/ 目录）
assets = { directory = "./public", binding = "ASSETS" }

# 普通配置（非密）
[vars]
ADMIN_PASSWORD = "888888"
# 个人信息保护法：活动结束后 10 天自动销毁所有预约信息
RETENTION_DAYS = "10"
REQUIRE_ID = "1"
CAPACITY = "30"
PEPPER = "change_me_pepper"
BASE_URL = ""

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "auto-expo-booking"
database_id = "23cfe14d-abdf-4321-a83e-93736cace739"

# 机密配置（ENCRYPTION_KEY）请改用 secret，不要写在这里：
#   npx wrangler secret put ENCRYPTION_KEY
