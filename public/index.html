<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>试乘体验预约 · 红旗粉丝家年华</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <section class="hero" style="padding:22px 20px 90px">
    <div class="hero-inner" style="text-align:center">
      <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:24px">
        <a class="appbar-tag" href="/" style="background:rgba(255,255,255,.18);color:#fff">🏠 报名入口</a>
        <a class="appbar-tag" href="/admin.html" style="background:rgba(255,255,255,.18);color:#fff">🔐 工作人员</a>
      </div>
      <h1 style="font-size:22px">红旗粉丝家年华暨智能科技体验日</h1>
      <p>试乘体验预约 · 8/14–8/15 限时开放</p>
    </div>
  </section>

  <main class="main">
    <div class="card">
      <h2>📅 选择日期与时段</h2>
      <div class="field">
        <label>日期 <span class="req">*</span></label>
        <select id="date" class="select">
          <option value="2026-08-14">2026-08-14（周五）</option>
          <option value="2026-08-15">2026-08-15（周六）</option>
        </select>
      </div>
      <div class="field">
        <label>时段 <span class="req">*</span></label>
        <div class="slot-grid" id="slots"><div class="muted">加载中…</div></div>
      </div>
    </div>

    <div class="card">
      <h2>👤 预约人信息</h2>
      <div class="row">
        <div class="field">
          <label>姓名 <span class="req">*</span></label>
          <input class="input" id="name" placeholder="请填写真实姓名" maxlength="20" />
        </div>
        <div class="field">
          <label>手机号 <span class="req">*</span></label>
          <input class="input" id="phone" placeholder="11 位手机号" maxlength="11" inputmode="numeric" />
        </div>
      </div>
      <div class="field">
        <label>身份证号 <span class="req">*</span></label>
        <input class="input" id="booker_id" placeholder="18 位身份证号" maxlength="18" />
        <p class="muted" style="margin:6px 0 0;font-size:12px">加密存储，仅用于活动现场身份核验，活动结束后自动销毁。</p>
      </div>
      <div class="field">
        <label>随行人（最多 2 人）</label>
        <div class="companion-row"><input class="input" placeholder="随行人 1 姓名（选填）" id="c1" maxlength="20" /></div>
        <div class="companion-row"><input class="input" placeholder="随行人 2 姓名（选填）" id="c2" maxlength="20" /></div>
      </div>

      <div class="alert danger">
        <span class="ico">⏰</span>
        <div class="body">
          <div class="title">仅在所选<span class="hl">预约时段</span>内可现场核销</div>
          <div class="desc">请按时到场，过期作废，名额不释放。</div>
        </div>
      </div>

      <div style="background:#f7f7f9;border-radius:6px;padding:10px 12px;font-size:12px;color:#7a7f8d;line-height:1.6;margin:12px 0">
        🔒 您的姓名、手机号、身份证号将<b style="color:#5a6478">加密存储</b>，仅用于本次试乘预约与现场核销，不作其他用途。活动结束后自动销毁。提交即表示同意。
      </div>
      <label class="checkbox-row">
        <input type="checkbox" id="consent" />
        <span>我已阅读并同意上述信息处理方式</span>
      </label>

      <button class="btn btn-primary btn-lg btn-block" id="submit">提交预约</button>
      <p id="msg" class="muted center" style="margin:10px 0 0"></p>
    </div>
  </main>

  <div class="toast-stack" id="toastStack"></div>
  <script src="/static/app.js"></script>
</body>
</html>
