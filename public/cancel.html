<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>取消预约 · 红旗粉丝家年华</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <section class="hero">
    <div class="hero-inner" style="text-align:center">
      <div style="display:flex;justify-content:flex-end;gap:6px;margin-bottom:10px">
        <a class="appbar-tag" href="/" style="background:rgba(255,255,255,.2);color:#fff">🏠 返回报名</a>
      </div>
      <h1 style="font-size:22px">取消预约</h1>
    </div>
  </section>

  <main class="main">
    <div class="card center">
      <div class="info-box" id="info"><div class="muted">加载中…</div></div>
      <div id="actions">
        <button class="btn btn-danger btn-block" id="confirmBtn" style="font-size:15px;padding:14px">
          🗑 立即删除我的报名信息
        </button>
        <p style="margin:12px 0 0"><a class="btn btn-ghost btn-sm" id="backBtn" href="/">返回</a></p>
      </div>
    </div>
  </main>

  <div class="toast-stack" id="toastStack"></div>
  <script src="/static/cancel.js"></script>
</body>
</html>
