# 自动部署到 Cloudflare Workers
# 触发：每次 push 到 main 分支，或手动在 Actions 页面点 Run workflow
# 前置（一次性）：在 GitHub 仓库 Settings → Secrets and variables → Actions 里添加：
#   CLOUDFLARE_API_TOKEN  —— Cloudflare 的 API Token（需 Workers 编辑 + D1 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 账户 ID
#   ENCRYPTION_KEY        —— 32 字节随机 base64（生成：node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"）
#   ADMIN_PASSWORD / PEPPER（可选，不填则用 wrangler.toml 里的默认值）
# 注意：D1 数据库需先在本地执行一次 `npx wrangler d1 create auto-expo-booking` 并把返回的
#       database_id 填进 wrangler.toml；之后本流水线负责同步代码与增量迁移。

name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (hono + wrangler)
        run: npm install

      - name: Push Cloudflare secrets (加密密钥 / 后台密码)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PEPPER: ${{ secrets.PEPPER }}
        run: |
          echo "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY
          [ -n "$ADMIN_PASSWORD" ] && echo "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          [ -n "$PEPPER" ] && echo "$PEPPER" | npx wrangler secret put PEPPER

      - name: Apply D1 migrations (幂等，可重复执行)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply auto-expo-booking --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
